<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font Reader</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="container">
        <header>
            <h1>Font Reader</h1>
            <p>Toggle font info mode to view style details on selection or page elements.</p>
        </header>
        <button id="toggleButton" class="toggle-button inactive">Enable font hints</button>
        <div id="result" class="result">
            <p>Use the toggle above to activate font info hints, then select text or click a page element.</p>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
